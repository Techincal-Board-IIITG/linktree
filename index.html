<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IIITG // Links</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="scanlines"></div>

    <main class="container">

        <header class="terminal-bar">

            <div class="terminal-prompt">

                <span class="prompt-symbol">
                    ❯
                </span>

                <span id="terminal-user"></span>

                <span id="terminal-command"></span>

                <span class="cursor"></span>

            </div>

            <div class="terminal-meta">

                <span id="terminal-name"></span>

                <span>|</span>

                <span>LINKS</span>

                <span>|</span>

                <span id="terminal-version"></span>

                <span class="status-dot"></span>

            </div>

        </header>


        <section class="hero">

            <div class="logo-column">

                <div class="logo-box">

                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>

                    <div
                        class="logo-text"
                        id="logo-name"
                    ></div>

                    <div
                        class="logo-subtitle"
                        id="logo-subtitle"
                    ></div>

                </div>


                <div class="terminal-description">

                    <span class="description-symbol">
                        &gt;
                    </span>

                    <p id="site-description"></p>

                </div>

            </div>


            <div class="hero-content">

                <div class="small-label">
                    WELCOME TO
                </div>

                <h1>

                    <span id="site-title"></span>

                    <span class="accent">
                        /
                    </span>

                    <br>

                    <span id="site-title-accent"></span>

                </h1>


                <p
                    class="hero-tagline"
                    id="site-tagline"
                ></p>


                <div class="hero-divider"></div>


                <p
                    class="hero-description"
                    id="hero-description"
                ></p>

            </div>

        </section>


        <section
            class="links-section"
            id="links"
        ></section>

    </main>


    <script src="config/theme.js"></script>

    <script src="config/links.js"></script>

    <script src="config/icons.js"></script>

    <script src="script.js"></script>

</body>

</html>
